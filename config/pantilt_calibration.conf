# 云台标定配置 —— 2026-10-07 由 pantilt_test calib 实测得到
#
# 格式：每行一个 `key = value`，`#` 起注释；空行忽略。
# 单位：PCA9685 在 50 Hz 下的 tick。
#   1 tick = 20 ms / 4096 ≈ 4.883 µs；MG90S 500–2400 µs 对应 180°，故 1 tick ≈ 0.4395°。
# 角度只用于估算，实际下发一律用 tick（rules/Hardware.md §1.1 禁止把角度当行程用）。
#
# 修改本文件必须附实测记录；任何放宽都要先改 rules/Hardware.md，不得静默放宽。
# 标定过程见 logs/phase1_phase2/20261007_calib_pan.log 与 20261007_calib_tilt.log。

prescale     = 121       # 50 Hz
bus          = 1
i2c_addr     = 0x40

# ---- Pan (CH0) ----
# min/max 两端都是操作者为 ±60° 行程指定的停止点，均未接近机械止点，故 safe 不再内缩。
pan_channel   = 0
pan_min_pwm   = 239      # 1.167 ms，-60.7°
pan_center_pwm = 377     # 1.837 ms，工作姿态
pan_max_pwm   = 515      # 2.514 ms，+60.7%；超出 MG90S 规格上限（约 2.4 ms），不得长时间驻留
pan_safe_min  = 239
pan_safe_max  = 515
pan_direction = ccw      # tick 增大 → 云台向左 / 逆时针（操作者面向设备实测）

# ---- Tilt (CH1) ----
# min 是真实机械止点前最后一格（122 已堵转嗡响），按 1/6 留余量；
# max 是应用边界（能拍到天花板即停），本身已保守，不再内缩。
tilt_channel  = 1
tilt_min_pwm  = 127      # 0.620 ms，-50.6°
tilt_home_pwm = 242      # 1.182 ms，摄像头垂直、拍摄方向朝前
tilt_max_pwm  = 342      # 1.670 ms，+44°；真实上界未知但 ≥342
tilt_safe_min = 162      # 127 + (342-127)/6 = 162，约 -35°
tilt_safe_max = 342
tilt_direction = back    # tick 增大 → 后仰 / 抬头
